<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chicken Road</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root{color-scheme:dark;--bg:#0f172a;--card:#1e293b;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--blue:#3b82f6;--green:#10b981;--gold:#fbbf24}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
    
    header{width:100%;max-width:600px;padding:15px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--line)}
    .balance{color:var(--gold);font-weight:bold;font-size:1.1rem}
    
    main{width:100%;max-width:600px;padding:10px;flex:1;display:flex;flex-direction:column;gap:10px}
    
    .canvas-container{
        width:100%;aspect-ratio:16/10;background:#1e293b;border-radius:12px;overflow:hidden;border:2px solid var(--line);position:relative;
    }
    canvas{display:block;width:100%;height:100%}

    .controls{background:var(--card);padding:15px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
    
    .info-row{display:flex;justify-content:space-between;font-size:0.9rem;color:var(--muted)}
    .info-row b{color:var(--text);font-size:1.1rem}

    .difficulty-selector{display:flex;gap:5px;background:#0f172a;padding:5px;border-radius:8px}
    .diff-btn{flex:1;border:none;background:transparent;color:var(--muted);padding:10px;border-radius:6px;cursor:pointer;font-size:0.85rem;transition:0.2s}
    .diff-btn.active{background:var(--gold);color:#0f172a;font-weight:bold}

    input[type=number]{width:100%;padding:14px;background:#0f172a;border:1px solid var(--line);border-radius:8px;color:white;text-align:center;font-size:1.1rem}

    .action-buttons{display:flex;gap:10px;margin-top:5px}
    .btn{flex:1;padding:16px;border:none;border-radius:8px;font-weight:bold;font-size:1.05rem;cursor:pointer;transition:0.2s}
    .btn-start{background:var(--blue);color:white}
    .btn-go{background:var(--green);color:white}
    .btn-cashout{background:var(--gold);color:#0f172a}
    .btn:disabled{opacity:0.5;cursor:not-allowed}

    .note{text-align:center;font-size:0.8rem;color:var(--muted);margin-top:5px}
</style>
</head>
<body>

<header>
    <span>🎮 بازی‌ها</span>
    <span class="balance">💰 <b id="balanceDisplay">1000</b> تومان</span>
</header>

<main>
    <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="info-row">
            <span>قدم امن: <b id="stepDisplay">0</b></span>
            <span>ضریب: <b id="multiplierDisplay">1.00x</b></span>
        </div>

        <div class="difficulty-selector">
            <button class="diff-btn" data-val="easy">آسان</button>
            <button class="diff-btn active" data-val="medium">متوسط</button>
            <button class="diff-btn" data-val="hard">سخت</button>
            <button class="diff-btn" data-val="hardcore">خیلی سخت</button>
        </div>

        <input type="number" id="betInput" value="100" min="10" step="10">

        <div class="action-buttons">
            <button id="btnStart" class="btn btn-start">شروع بازی 🐔</button>
            <button id="btnGo" class="btn btn-go" style="display:none">GO ➡️</button>
            <button id="btnCashout" class="btn btn-cashout" style="display:none">برداشت سود</button>
        </div>
        
        <p class="note" id="statusText">مبلغ را وارد کن و شروع کن</p>
    </div>
</main>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let balance = parseInt(localStorage.getItem('cr_balance') || '1000');

const RISKS = { easy: 0.10, medium: 0.20, hard: 0.35, hardcore: 0.50 };
let currentRisk = RISKS.medium;
let gameState = 'IDLE';
let currentStep = 0;
let crashAtStep = -1;
let betAmount = 0;

const COLS = 10;
const COL_WIDTH = 140;
let cameraX = 0;
const CHICKEN_SCREEN_X = 120;

let cellW, cellH;

function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    cellW = canvas.width / 4;
    cellH = canvas.height;
}
window.addEventListener('resize', resize);
resize();

function updateUI() {
    document.getElementById('balanceDisplay').innerText = balance.toLocaleString('fa-IR');
    document.getElementById('stepDisplay').innerText = currentStep;
    
    let mult = currentStep > 0 ? calculateMultiplier(currentStep) : "1.00";
    document.getElementById('multiplierDisplay').innerText = mult + "x";

    const btnStart = document.getElementById('btnStart');
    const btnGo = document.getElementById('btnGo');
    const btnCashout = document.getElementById('btnCashout');
    const status = document.getElementById('statusText');

    if (gameState === 'IDLE' || gameState === 'LOST' || gameState === 'CASHED') {
        btnStart.style.display = 'block';
        btnGo.style.display = 'none';
        btnCashout.style.display = 'none';
        status.innerText = gameState === 'LOST' ? '💥 باختی! دوباره تلاش کن' : (gameState === 'CASHED' ? '✅ برنده شدی!' : 'مبلغ را وارد کن و شروع کن');
    } else if (gameState === 'PLAYING') {
        btnStart.style.display = 'none';
        btnGo.style.display = 'block';
        btnCashout.style.display = currentStep > 0 ? 'block' : 'none';
        
        let winAmt = Math.floor(betAmount * calculateMultiplier(currentStep));
        btnCashout.innerText = `برداشت ${winAmt.toLocaleString('fa-IR')} تومان`;
        status.innerText = `مرغ در ستون ${currentStep} امن است. برو بعدی؟`;
    }
}

function calculateMultiplier(step) {
    return (0.95 / Math.pow(1 - currentRisk, step)).toFixed(2);
}

function startGame() {
    let val = parseInt(document.getElementById('betInput').value);
    if (isNaN(val) || val < 10 || val > balance) {
        alert('موجودی کافی نیست');
        return;
    }
    
    betAmount = val;
    balance -= betAmount;
    localStorage.setItem('cr_balance', balance);
    
    currentStep = 0;
    cameraX = 0;
    gameState = 'PLAYING';
    
    crashAtStep = 0;
    while (Math.random() > currentRisk && crashAtStep < COLS) {
        crashAtStep++;
    }
    if(crashAtStep >= COLS) crashAtStep = COLS + 1;

    updateUI();
}

function goNext() {
    if (gameState !== 'PLAYING') return;
    
    currentStep++;
    cameraX = (currentStep - 1) * COL_WIDTH;
    
    if (currentStep >= crashAtStep) {
        gameState = 'LOST';
    } else {
        if (currentStep >= COLS) cashout();
    }
    updateUI();
}

function cashout() {
    if (gameState !== 'PLAYING') return;
    let win = Math.floor(betAmount * calculateMultiplier(currentStep));
    balance += win;
    localStorage.setItem('cr_balance', balance);
    gameState = 'CASHED';
    updateUI();
}

document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        if(gameState !== 'IDLE' && gameState !== 'LOST' && gameState !== 'CASHED') return;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentRisk = RISKS[e.target.dataset.val];
    });
});

document.getElementById('btnStart').onclick = startGame;
document.getElementById('btnGo').onclick = goNext;
document.getElementById('btnCashout').onclick = cashout;

// ماشین زیباتر
function drawCar(x, y, color, direction) {
    ctx.save();
    ctx.translate(x, y);
    
    // سایه
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 45, 35, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // بدنه اصلی
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-30, -40, 60, 80, 8);
    ctx.fill();
    
    // سقف/کابین
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.roundRect(-25, -20, 50, 40, 5);
    ctx.fill();
    
    // شیشه جلو
    ctx.fillStyle = '#7dd3fc';
    ctx.beginPath();
    ctx.roundRect(-22, -35, 44, 20, 4);
    ctx.fill();
    
    // شیشه عقب
    ctx.fillStyle = '#7dd3fc';
    ctx.beginPath();
    ctx.roundRect(-22, 15, 44, 20, 4);
    ctx.fill();
    
    // چراغ‌های جلو
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(-25, -38, 12, 6);
    ctx.fillRect(13, -38, 12, 6);
    
    // چراغ‌های عقب
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-25, 32, 12, 6);
    ctx.fillRect(13, 32, 12, 6);
    
    // چرخ‌ها
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(-28, -25, 8, 0, Math.PI * 2);
    ctx.arc(28, -25, 8, 0, Math.PI * 2);
    ctx.arc(-28, 25, 8, 0, Math.PI * 2);
    ctx.arc(28, 25, 8, 0, Math.PI * 2);
    ctx.fill();
    
    // رینگ چرخ
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath();
    ctx.arc(-28, -25, 4, 0, Math.PI * 2);
    ctx.arc(28, -25, 4, 0, Math.PI * 2);
    ctx.arc(-28, 25, 4, 0, Math.PI * 2);
    ctx.arc(28, 25, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

// مرغ زیباتر و بزرگتر
function drawChicken(x, y, isDead) {
    ctx.save();
    ctx.translate(x, y);
    
    if(isDead) {
        ctx.rotate(Math.PI / 3);
        ctx.globalAlpha = 0.7;
    }
    
    // سایه
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 35, 25, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // بدن (بیضی سفید)
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.ellipse(0, 10, 28, 32, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // بال چپ
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.ellipse(-15, 5, 12, 18, -0.3, 0, Math.PI * 2);
    ctx.fill();
    
    // بال راست
    ctx.beginPath();
    ctx.ellipse(15, 5, 12, 18, 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    // سر (دایره سفید)
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.arc(0, -20, 22, 0, Math.PI * 2);
    ctx.fill();
    
    // تاج قرمز (سه دایره)
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, -42, 8, 0, Math.PI * 2);
    ctx.arc(-10, -38, 6, 0, Math.PI * 2);
    ctx.arc(10, -38, 6, 0, Math.PI * 2);
    ctx.fill();
    
    // منقار (مثلث نارنجی)
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(18, -22);
    ctx.lineTo(32, -18);
    ctx.lineTo(18, -14);
    ctx.closePath();
    ctx.fill();
    
    // چشم (دایره سیاه با نقطه سفید)
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(10, -25, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(11, -26, 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    // گونه قرمز
    ctx.fillStyle = '#fca5a5';
    ctx.beginPath();
    ctx.arc(14, -15, 4, 0, Math.PI * 2);
    ctx.fill();
    
    // پاها (خطوط نارنجی)
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-10, 35);
    ctx.lineTo(-12, 48);
    ctx.moveTo(10, 35);
    ctx.lineTo(12, 48);
    ctx.stroke();
    
    // انگشتان پا
    ctx.beginPath();
    ctx.moveTo(-12, 48);
    ctx.lineTo(-16, 52);
    ctx.moveTo(-12, 48);
    ctx.lineTo(-8, 52);
    ctx.moveTo(12, 48);
    ctx.lineTo(8, 52);
    ctx.moveTo(12, 48);
    ctx.lineTo(16, 52);
    ctx.stroke();
    
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // پس زمینه جاده (خاکستری تیره)
    ctx.fillStyle = '#475569';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // خطوط ستون‌ها (سفید dashed)
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 3;
    ctx.setLineDash([15, 15]);
    
    for(let i=0; i<=COLS; i++) {
        let worldX = i * COL_WIDTH;
        let screenX = worldX - cameraX;
        
        if(screenX > -50 && screenX < canvas.width + 50) {
            ctx.beginPath();
            ctx.moveTo(screenX, 0);
            ctx.lineTo(screenX, canvas.height);
            ctx.stroke();
        }
    }
    ctx.setLineDash([]);

    // ضرایب در دایره‌های سفید
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 18px system-ui';
    
    for(let i=0; i<COLS; i++) {
        let worldX = i * COL_WIDTH + COL_WIDTH/2;
        let screenX = worldX - cameraX;
        let cy = canvas.height - 60;
        let mult = calculateMultiplier(i+1);
        
        if(screenX > -50 && screenX < canvas.width + 50) {
            // دایره ضریب
            ctx.beginPath();
            ctx.arc(screenX, cy, 35, 0, Math.PI*2);
            ctx.fillStyle = i < currentStep ? '#10b981' : '#1e293b';
            if(i === currentStep && gameState === 'PLAYING') ctx.fillStyle = '#fbbf24';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // متن ضریب
            ctx.fillStyle = '#fff';
            ctx.fillText(mult + 'x', screenX, cy);
        }
    }

    // ماشین‌ها (رنگ‌های مختلف)
    let time = Date.now() / 1000;
    const carColors = ['#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6', '#10b981', '#ec4899'];
    
    for(let col=0; col<COLS; col++) {
        let worldColX = col * COL_WIDTH + COL_WIDTH/2;
        let screenColX = worldColX - cameraX;
        
        if(screenColX < -100 || screenColX > canvas.width + 100) continue;
        
        let speed = 1.2 + (col * 0.15);
        let offset1 = (time * speed * 50) % (canvas.height + 120);
        let offset2 = (canvas.height + 120) - offset1;
        
        let isCrashCol = (gameState === 'LOST' && col === currentStep - 1);
        
        if(!isCrashCol) {
            drawCar(screenColX, offset1 - 60, carColors[col % 6], 'down');
            drawCar(screenColX, offset2 - 60, carColors[(col+2) % 6], 'up');
        } else {
            // ماشین تصادف دقیقاً روی مرغ
            drawCar(screenColX, canvas.height/2, '#ef4444', 'down');
        }
    }

    // مرغ (همیشه در CHICKEN_SCREEN_X)
    if (gameState !== 'IDLE') {
        let chickenY = canvas.height / 2;
        let isDead = gameState === 'LOST';
        drawChicken(CHICKEN_SCREEN_X, chickenY, isDead);
    }

    requestAnimationFrame(draw);
}

updateUI();
draw();
</script>
</body>
</html>
