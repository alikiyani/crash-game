<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chicken Road</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root{color-scheme:dark;--bg:#1a202c;--card:#2d3748;--line:#4a5568;--text:#f7fafc;--muted:#a0aec0;--green:#48bb78;--gold:#ecc94b}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
    
    header{width:100%;max-width:600px;padding:15px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-bottom:1px solid var(--line)}
    .balance{color:var(--gold);font-weight:bold;font-size:1.1rem}
    
    main{width:100%;max-width:600px;padding:10px;flex:1;display:flex;flex-direction:column;gap:10px}
    
    .canvas-container{
        width:100%;aspect-ratio:16/9;background:#2d3748;border-radius:12px;overflow:hidden;border:2px solid var(--line);position:relative;
    }
    canvas{display:block;width:100%;height:100%}

    .controls{background:var(--card);padding:15px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
    
    .info-row{display:flex;justify-content:space-between;font-size:0.9rem;color:var(--muted)}
    .info-row b{color:var(--text)}

    .difficulty-selector{display:flex;gap:5px;background:#1a202c;padding:5px;border-radius:8px}
    .diff-btn{flex:1;border:none;background:transparent;color:var(--muted);padding:8px;border-radius:6px;cursor:pointer;font-size:0.8rem;transition:0.2s}
    .diff-btn.active{background:var(--gold);color:#1a202c;font-weight:bold}

    input[type=number]{width:100%;padding:12px;background:#1a202c;border:1px solid var(--line);border-radius:8px;color:white;text-align:center;font-size:1rem}

    .action-buttons{display:flex;gap:10px;margin-top:5px}
    .btn{flex:1;padding:14px;border:none;border-radius:8px;font-weight:bold;font-size:1rem;cursor:pointer;transition:0.2s}
    .btn-start{background:var(--green);color:white}
    .btn-go{background:#38bdf8;color:#1a202c}
    .btn-cashout{background:var(--gold);color:#1a202c}
    .btn:disabled{opacity:0.5;cursor:not-allowed;filter:grayscale(1)}

    .note{text-align:center;font-size:0.75rem;color:var(--muted);margin-top:5px}
</style>
</head>
<body>

<header>
    <span>🐔 CHICKEN ROAD</span>
    <span class="balance">💰 <b id="balanceDisplay">1000</b></span>
</header>

<main>
    <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="info-row">
            <span>قدم فعلی: <b id="stepDisplay">0</b></span>
            <span>ضریب: <b id="multiplierDisplay">1.00x</b></span>
        </div>

        <div class="difficulty-selector" id="diffSelector">
            <button class="diff-btn" data-val="easy">آسان</button>
            <button class="diff-btn active" data-val="medium">متوسط</button>
            <button class="diff-btn" data-val="hard">سخت</button>
            <button class="diff-btn" data-val="hardcore">هاردکور</button>
        </div>

        <input type="number" id="betInput" value="100" min="10" step="10">

        <div class="action-buttons">
            <button id="btnStart" class="btn btn-start">شروع بازی</button>
            <button id="btnGo" class="btn btn-go" style="display:none">GO ➡️</button>
            <button id="btnCashout" class="btn btn-cashout" style="display:none">برداشت سود</button>
        </div>
        
        <p class="note" id="statusText">مبلغ شرط را وارد کرده و شروع کنید</p>
    </div>
</main>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let balance = parseInt(localStorage.getItem('cr_balance') || '1000');

const RISKS = { easy: 0.10, medium: 0.20, hard: 0.35, hardcore: 0.50 };
let currentRisk = RISKS.medium;
let gameState = 'IDLE';
let currentStep = 0;
let crashAtStep = -1;
let betAmount = 0;

const COLS = 10; // تعداد کل ستون‌ها در دنیا
const COL_WIDTH = 120; // عرض هر ستون
let cameraX = 0; // موقعیت دوربین
const CHICKEN_SCREEN_X = 100; // مرغ همیشه در این موقعیت از صفحه است

let cellW, cellH;

function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    cellW = canvas.width / 4; // 4 ستون در صفحه جا بشه
    cellH = canvas.height;
}
window.addEventListener('resize', resize);
resize();

function updateUI() {
    document.getElementById('balanceDisplay').innerText = balance.toLocaleString('fa-IR');
    document.getElementById('stepDisplay').innerText = currentStep;
    
    let mult = currentStep > 0 ? calculateMultiplier(currentStep) : "1.00";
    document.getElementById('multiplierDisplay').innerText = mult + "x";

    const btnStart = document.getElementById('btnStart');
    const btnGo = document.getElementById('btnGo');
    const btnCashout = document.getElementById('btnCashout');
    const status = document.getElementById('statusText');

    if (gameState === 'IDLE' || gameState === 'LOST' || gameState === 'CASHED') {
        btnStart.style.display = 'block';
        btnGo.style.display = 'none';
        btnCashout.style.display = 'none';
        btnStart.disabled = false;
        status.innerText = gameState === 'LOST' ? 'باختی! دوباره تلاش کن.' : (gameState === 'CASHED' ? 'برنده شدی!' : 'آماده شروع');
    } else if (gameState === 'PLAYING') {
        btnStart.style.display = 'none';
        btnGo.style.display = 'block';
        btnCashout.style.display = currentStep > 0 ? 'block' : 'none';
        
        let winAmt = Math.floor(betAmount * calculateMultiplier(currentStep));
        btnCashout.innerText = `برداشت (${winAmt})`;
        status.innerText = `مرغ در ستون ${currentStep} امن است. برو بعدی؟`;
    }
}

function calculateMultiplier(step) {
    return (0.95 / Math.pow(1 - currentRisk, step)).toFixed(2);
}

function startGame() {
    let val = parseInt(document.getElementById('betInput').value);
    if (isNaN(val) || val < 10 || val > balance) {
        alert('موجودی کافی نیست یا مبلغ اشتباه است');
        return;
    }
    
    betAmount = val;
    balance -= betAmount;
    localStorage.setItem('cr_balance', balance);
    
    currentStep = 0;
    cameraX = 0; // ریست دوربین
    gameState = 'PLAYING';
    
    crashAtStep = 0;
    while (Math.random() > currentRisk && crashAtStep < COLS) {
        crashAtStep++;
    }
    if(crashAtStep >= COLS) crashAtStep = COLS + 1;

    updateUI();
}

function goNext() {
    if (gameState !== 'PLAYING') return;
    
    currentStep++;
    
    // دوربین همراه مرغ حرکت می‌کند
    cameraX = (currentStep - 1) * COL_WIDTH;
    
    if (currentStep >= crashAtStep) {
        gameState = 'LOST';
    } else {
        if (currentStep >= COLS) {
            cashout();
        }
    }
    updateUI();
}

function cashout() {
    if (gameState !== 'PLAYING') return;
    let win = Math.floor(betAmount * calculateMultiplier(currentStep));
    balance += win;
    localStorage.setItem('cr_balance', balance);
    gameState = 'CASHED';
    updateUI();
}

document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        if(gameState !== 'IDLE' && gameState !== 'LOST' && gameState !== 'CASHED') return;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentRisk = RISKS[e.target.dataset.val];
    });
});

document.getElementById('btnStart').onclick = startGame;
document.getElementById('btnGo').onclick = goNext;
document.getElementById('btnCashout').onclick = cashout;

function drawCar(x, y, color, isUp) {
    ctx.save();
    ctx.translate(x, y);
    if (!isUp) ctx.scale(1, -1);
    
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-25, -40, 50, 80, 8);
    ctx.fill();
    
    ctx.fillStyle = '#bae6fd';
    ctx.fillRect(-20, -30, 40, 20);
    
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(-20, -38, 10, 5);
    ctx.fillRect(10, -38, 10, 5);
    
    ctx.restore();
}

function drawChicken(x, y, isDead) {
    ctx.save();
    ctx.translate(x, y);
    
    if(isDead) {
        ctx.rotate(Math.PI / 4);
    }

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(0, 10, 20, 25, 0, 0, Math.PI*2);
    ctx.fill();
    
    ctx.beginPath();
    ctx.arc(0, -15, 18, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, -32, 6, 0, Math.PI*2);
    ctx.arc(-8, -28, 5, 0, Math.PI*2);
    ctx.arc(8, -28, 5, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(15, -15);
    ctx.lineTo(28, -10);
    ctx.lineTo(15, -5);
    ctx.fill();
    
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(8, -18, 3, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // رسم پس زمینه جاده
    ctx.fillStyle = '#4a5568';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // رسم خطوط ستون‌ها (با در نظر گرفتن cameraX)
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    
    for(let i=0; i<=COLS; i++) {
        let worldX = i * COL_WIDTH;
        let screenX = worldX - cameraX;
        
        // فقط ستون‌های داخل صفحه را رسم کن
        if(screenX > -50 && screenX < canvas.width + 50) {
            ctx.beginPath();
            ctx.moveTo(screenX, 0);
            ctx.lineTo(screenX, canvas.height);
            ctx.stroke();
        }
    }
    ctx.setLineDash([]);

    // رسم ضرایب (با در نظر گرفتن cameraX)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 16px system-ui';
    
    for(let i=0; i<COLS; i++) {
        let worldX = i * COL_WIDTH + COL_WIDTH/2;
        let screenX = worldX - cameraX;
        let cy = canvas.height - 50;
        let mult = calculateMultiplier(i+1);
        
        if(screenX > -50 && screenX < canvas.width + 50) {
            ctx.beginPath();
            ctx.arc(screenX, cy, 30, 0, Math.PI*2);
            ctx.fillStyle = i < currentStep ? '#48bb78' : '#2d3748';
            if(i === currentStep && gameState === 'PLAYING') ctx.fillStyle = '#ecc94b';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#fff';
            ctx.fillText(mult + 'x', screenX, cy);
        }
    }

    // رسم ماشین‌ها (با در نظر گرفتن cameraX)
    let time = Date.now() / 1000;
    const carColors = ['#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6', '#10b981'];
    
    for(let col=0; col<COLS; col++) {
        let worldColX = col * COL_WIDTH + COL_WIDTH/2;
        let screenColX = worldColX - cameraX;
        
        // فقط ستون‌های داخل صفحه
        if(screenColX < -100 || screenColX > canvas.width + 100) continue;
        
        let speed = 1.5 + (col * 0.2);
        let offset1 = (time * speed * 60) % (canvas.height + 100);
        let offset2 = (canvas.height + 100) - offset1;
        
        let isCrashCol = (gameState === 'LOST' && col === currentStep - 1);
        
        if(!isCrashCol) {
            drawCar(screenColX, offset1 - 50, carColors[col % 5], true);
            drawCar(screenColX, offset2 - 50, carColors[(col+1) % 5], false);
        } else {
            drawCar(screenColX, canvas.height/2, '#ef4444', true);
        }
    }

    // رسم مرغ (همیشه در CHICKEN_SCREEN_X ثابت)
    if (gameState !== 'IDLE') {
        let chickenY = canvas.height / 2;
        let isDead = gameState === 'LOST';
        drawChicken(CHICKEN_SCREEN_X, chickenY, isDead);
    }

    requestAnimationFrame(draw);
}

updateUI();
draw();

</script>
</body>
</html>
