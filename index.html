<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>بازی انفجار و مرغ جاده | Game Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #24304f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #06b6d4;
      --primary-glow: rgba(6, 182, 212, 0.4);
      --accent: #f43f5e;
      --success: #10b981;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
      overflow-x: hidden; touch-action: manipulation;
    }
    header {
      background: rgba(19,27,46,0.85); border-bottom: 1px solid var(--border); padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; }
    .balance-badge { display: flex; align-items: center; gap: 8px; background: rgba(251,191,36,0.1); padding: 6px 12px; border-radius: 20px; color: var(--gold); font-weight: 800; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-icon {
      width: 34px; height: 34px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.04);
      color: var(--text); cursor: pointer; font-size: 1rem;
    }
    .tab-bar { display: flex; gap: 10px; padding: 10px 16px; }
    .tab-btn {
      flex: 1; border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--muted);
      padding: 10px; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(99,102,241,0.2)); color: #fff; border-color: var(--primary); }
    main { width: min(520px, 100%); margin: 0 auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px; }
    .game-section { display: none; flex-direction: column; gap: 14px; }
    .game-section.active { display: flex; }
    .canvas-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
    canvas { display: block; width: 100%; height: auto; background: #060911; }
    .bet-panel { border: 1px solid var(--border); background: var(--card); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .bet-header { display: flex; justify-content: space-between; font-size: 0.84rem; color: var(--muted); font-weight: 700; }
    .bet-input-row { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); }
    .bet-input { background: transparent; border: none; color: #fff; font-size: 1.2rem; font-weight: 800; width: 100%; text-align: left; direction: ltr; }
    .bet-unit { color: var(--muted); font-size: 0.8rem; }
    .quick-bets { display: flex; gap: 6px; }
    .q-btn { flex: 1; padding: 8px 0; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); font-weight: 700; cursor: pointer; }
    .action-btn { width: 100%; border: none; border-radius: 16px; padding: 16px; font-weight: 900; font-size:1.12rem; cursor: pointer; }
    .btn-bet { background: linear-gradient(135deg, #06b6d4, #2563eb); color: white; }
    .btn-cashout { background: linear-gradient(135deg, #10b981, #059669); color: white; animation: pulse 0.9s infinite alternate; }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.02); filter: brightness(1.15); } }
    .dpad-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .dpad-row { display: flex; gap: 12px; }
    .dpad-btn {
      width: 58px; height: 58px; border-radius: 14px; border: 2px solid var(--border); background: var(--card);
      color: var(--text); font-size: 1.35rem; cursor: pointer;
    }
    .cashout-row { display: flex; gap: 8px; }
    .cashout-row .action-btn { flex: 1; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
      background: rgba(19,27,46,0.96); border: 1px solid var(--primary); color: #fff; border-radius: 30px;
      padding: 12px 22px; font-weight: 700; pointer-events: none; transition: all 0.3s ease; z-index: 1000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <div class="brand">🎯 <span id="userNameDisplay">بازی انفجار</span></div>
    <div class="balance-badge"><span>💰</span><span id="balanceDisplay">1,000</span><span style="font-size:0.75rem;">تومان</span></div>
    <div class="header-actions"><button class="btn-icon" id="soundToggle">🔊</button></div>
  </header>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabRocketBtn" onclick="switchGame('rocket')">🚀 بازی انفجار</button>
    <button class="tab-btn" id="tabChickenBtn" onclick="switchGame('chicken')">🐔 مرغ جاده</button>
  </div>

  <main>
    <div id="rocketSection" class="game-section active">
      <div class="canvas-card"><canvas id="rocketCanvas" width="500" height="320"></canvas></div>
      <div class="bet-panel">
        <div class="bet-header"><span>مبلغ شرط</span><span>حداقل: ۱۰</span></div>
        <div class="bet-input-row">
          <input type="number" id="betAmountInput" class="bet-input" value="100" min="10" step="10" />
          <span class="bet-unit">تومان</span>
        </div>
        <div class="quick-bets">
          <button class="q-btn" onclick="adjustBet('half')">½ نصف</button>
          <button class="q-btn" onclick="adjustBet('double')">۲x</button>
          <button class="q-btn" onclick="adjustBet('add100')">+۱۰۰</button>
          <button class="q-btn" onclick="adjustBet('max')">حداکثر</button>
        </div>
      </div>
      <button id="rocketActionBtn" class="action-btn btn-bet" onclick="handleRocketAction()"><span>ثبت شرط و شروع پرواز 🚀</span></button>
    </div>

    <div id="chickenSection" class="game-section">
      <div class="canvas-card"><canvas id="chickenCanvas" width="400" height="400"></canvas></div>
      <div class="bet-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:800; font-size:0.9rem;">
          <span>ضریب فعلی: <span id="chickenMultiplierText" style="color:var(--primary);">1.00x</span></span>
          <span>برداشت: <span id="chickenCashoutText" style="color:var(--gold);">0 تومان</span></span>
        </div>
      </div>
      <div class="cashout-row">
        <button class="action-btn btn-bet" id="chickenCashoutBtn" onclick="cashOutChicken()">برداشت 💰</button>
      </div>
      <div class="dpad-container">
        <button class="dpad-btn" onclick="moveChicken('up')">⬆️</button>
        <div class="dpad-row">
          <button class="dpad-btn" onclick="moveChicken('left')">⬅️</button>
          <button class="dpad-btn" onclick="moveChicken('down')">⬇️</button>
          <button class="dpad-btn" onclick="moveChicken('right')">➡️</button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast">پیام</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let balance = parseInt(localStorage.getItem('user_balance') || '1000', 10);
    function updateBalanceDisplay() {
      document.getElementById('balanceDisplay').textContent = balance.toLocaleString('fa-IR');
      localStorage.setItem('user_balance', String(balance));
    }
    updateBalanceDisplay();

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function adjustBet(action) {
      const input = document.getElementById('betAmountInput');
      let value = parseInt(input.value || '100', 10);
      if (action === 'half') value = Math.max(10, Math.floor(value / 2));
      else if (action === 'double') value = Math.min(balance, value * 2);
      else if (action === 'add100') value = Math.min(balance, value + 100);
      else if (action === 'max') value = Math.max(10, balance);
      input.value = value;
    }

    let audioCtx = null;
    let soundEnabled = true;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    function playTone(freq, type, duration, slide=null) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slide) osc.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
    function soundJump() { playTone(320, 'triangle', 0.12, 620); }
    function soundCrash() { playTone(120, 'sawtooth', 0.35, 40); }
    function soundWin() { playTone(500, 'sine', 0.12, 700); }
    document.getElementById('soundToggle').onclick = () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
      showToast(soundEnabled ? 'صدا فعال شد' : 'صدا قطع شد');
    };

    let activeGame = 'rocket';
    function switchGame(game) {
      activeGame = game;
      document.getElementById('tabRocketBtn').classList.toggle('active', game === 'rocket');
      document.getElementById('tabChickenBtn').classList.toggle('active', game === 'chicken');
      document.getElementById('rocketSection').classList.toggle('active', game === 'rocket');
      document.getElementById('chickenSection').classList.toggle('active', game === 'chicken');
      if (game === 'chicken' && !chRunning) initChickenGame();
    }

    // Crash game logic
    const rCanvas = document.getElementById('rocketCanvas');
    const rCtx = rCanvas.getContext('2d');
    let rState = 'IDLE';
    let rMultiplier = 1.00;
    let rTargetCrash = 1.00;
    let rStartTime = 0;
    let currentBet = 100;
    let rParticles = [];
    let rRestartTimer = null;

    function scheduleRocketRestart() {
      clearTimeout(rRestartTimer);
      rRestartTimer = setTimeout(() => {
        rState = 'IDLE';
        rMultiplier = 1.00;
        rTargetCrash = 1.00;
        rParticles = [];
        const btn = document.getElementById('rocketActionBtn');
        btn.className = 'action-btn btn-bet';
        btn.innerHTML = '<span>ثبت شرط و شروع پرواز 🚀</span>';
        showToast('دور جدید شروع شد');
      }, 10000);
    }

    class RocketParticle {
      constructor(x, y) {
        this.x = x; this.y = y; this.vx = (Math.random()-0.5)*3-2; this.vy = (Math.random()-0.5)*3+2; this.life = 1; this.decay = 0.035 + Math.random()*0.03; this.size = 4 + Math.random()*5; this.color = Math.random() > 0.4 ? '#fbbf24' : '#ef4444';
      }
      update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
      draw(ctx) { ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); ctx.restore(); }
    }

    const rStars = Array.from({ length: 40 }, () => ({ x: Math.random()*500, y: Math.random()*320, size: Math.random()*1.8+0.5, speed: Math.random()*0.8+0.2 }));

    function drawRocketBackground() {
      rCtx.fillStyle = '#060913'; rCtx.fillRect(0,0,500,320);
      rCtx.fillStyle = '#94a3b8';
      rStars.forEach(s => {
        if (rState === 'FLYING') { s.x -= s.speed * (1 + (rMultiplier - 1) * 0.8); s.y += s.speed * 0.5; if (s.x < 0) s.x = 500; if (s.y > 320) s.y = 0; }
        rCtx.beginPath(); rCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2); rCtx.fill();
      });
      rCtx.strokeStyle = 'rgba(36,48,79,0.35)'; rCtx.lineWidth = 1;
      for (let x = 40; x < 500; x += 50) { rCtx.beginPath(); rCtx.moveTo(x,0); rCtx.lineTo(x,320); rCtx.stroke(); }
      for (let y = 30; y < 320; y += 45) { rCtx.beginPath(); rCtx.moveTo(0,y); rCtx.lineTo(500,y); rCtx.stroke(); }
    }

    function drawRocket(x, y, angle, crashed=false) {
      rCtx.save(); rCtx.translate(x, y); rCtx.rotate(angle);
      if (crashed) {
        rCtx.fillStyle = '#ef4444';
        for (let i = 0; i < 10; i++) { rCtx.beginPath(); rCtx.arc((Math.random()-0.5)*35, (Math.random()-0.5)*35, Math.random()*8+3, 0, Math.PI*2); rCtx.fill(); }
        rCtx.restore(); return;
      }
      rCtx.fillStyle = '#fbbf24';
      rCtx.beginPath(); rCtx.moveTo(-12,-4); rCtx.lineTo(-24-Math.random()*8,0); rCtx.lineTo(-12,4); rCtx.closePath(); rCtx.fill();
      rCtx.fillStyle = '#f8fafc';
      rCtx.beginPath(); rCtx.moveTo(18,0); rCtx.quadraticCurveTo(0,-9,-12,-7); rCtx.lineTo(-12,7); rCtx.quadraticCurveTo(0,9,18,0); rCtx.closePath(); rCtx.fill();
      rCtx.fillStyle = '#06b6d4';
      rCtx.beginPath(); rCtx.moveTo(-6,-7); rCtx.lineTo(-14,-14); rCtx.lineTo(-10,-5); rCtx.closePath(); rCtx.fill();
      rCtx.beginPath(); rCtx.moveTo(-6,7); rCtx.lineTo(-14,14); rCtx.lineTo(-10,5); rCtx.closePath(); rCtx.fill();
      rCtx.fillStyle = '#38bdf8'; rCtx.beginPath(); rCtx.arc(4, 0, 4, 0, Math.PI*2); rCtx.fill(); rCtx.restore();
    }

    function renderRocketFrame() {
      drawRocketBackground();
      const sx = 40, sy = 280;
      if (rState === 'IDLE') {
        drawRocket(sx, sy, -Math.PI/4);
        rCtx.fillStyle = '#94a3b8'; rCtx.font = 'bold 22px system-ui'; rCtx.textAlign = 'center'; rCtx.fillText('آماده پرواز', 250, 140);
        rCtx.font = '14px system-ui'; rCtx.fillText('مبلغ شرط را تعیین کن و شروع کن', 250, 175);
        return;
      }
      const progress = Math.min(1, (rMultiplier - 1)/4);
      const x = sx + 400 * Math.pow(progress, 0.75);
      const y = sy - 220 * Math.pow(progress, 0.85);
      rCtx.save();
      rCtx.strokeStyle = rState === 'CRASHED' ? '#ef4444' : '#06b6d4';
      rCtx.lineWidth = 4; rCtx.shadowColor = rState === 'CRASHED' ? 'rgba(239,68,68,0.8)' : 'rgba(6,182,212,0.8)'; rCtx.shadowBlur = 12;
      rCtx.beginPath(); rCtx.moveTo(sx,sy); rCtx.quadraticCurveTo((sx+x)/2, sy, x, y); rCtx.stroke(); rCtx.restore();
      if (rState === 'FLYING') rParticles.push(new RocketParticle(x-10, y+6));
      for (let i = rParticles.length - 1; i >= 0; i--) { rParticles[i].update(); rParticles[i].draw(rCtx); if (rParticles[i].life <= 0) rParticles.splice(i,1); }
      drawRocket(x, y, -Math.atan2(sy-y, x-sx) * 0.7, rState === 'CRASHED');
      rCtx.save(); rCtx.textAlign = 'center'; rCtx.font = '900 48px system-ui';
      if (rState === 'CRASHED') {
        rCtx.fillStyle = '#ef4444'; rCtx.shadowColor = 'rgba(239,68,94,0.7)'; rCtx.shadowBlur = 16; rCtx.fillText('انفجار! 💥', 250, 90); rCtx.font = 'bold 24px system-ui'; rCtx.fillText(rMultiplier.toFixed(2) + 'x', 250, 135);
      } else if (rState === 'CASHED') {
        rCtx.fillStyle = '#10b981'; rCtx.shadowColor = 'rgba(16,185,129,0.7)'; rCtx.shadowBlur = 16; rCtx.fillText('برداشت موفق! 💰', 250, 90); rCtx.font = 'bold 24px system-ui'; rCtx.fillText(rMultiplier.toFixed(2) + 'x', 250, 135);
      } else {
        rCtx.fillStyle = '#38bdf8'; rCtx.shadowColor = 'rgba(56,189,248,0.7)'; rCtx.shadowBlur = 16; rCtx.fillText(rMultiplier.toFixed(2) + 'x', 250, 100);
      }
      rCtx.restore();
    }

    function rocketLoop() {
      if (rState === 'FLYING') {
        const elapsed = (Date.now() - rStartTime) / 1000;
        rMultiplier = 1 + Math.pow(elapsed * 0.9, 1.45);
        const profit = Math.floor(currentBet * rMultiplier);
        document.getElementById('rocketActionBtn').innerHTML = `<span>برداشت سود (${profit.toLocaleString('fa-IR')} تومان) 💰</span>`;
        if (rMultiplier >= rTargetCrash) {
          rState = 'CRASHED';
          soundCrash();
          const btn = document.getElementById('rocketActionBtn');
          btn.className = 'action-btn btn-bet';
          btn.innerHTML = '<span>ثبت شرط بعدی 🔄</span>';
          showToast('موشک منفجر شد و شرط شما سوخت.');
          scheduleRocketRestart();
        }
      }
      renderRocketFrame();
      requestAnimationFrame(rocketLoop);
    }
    requestAnimationFrame(rocketLoop);

    function handleRocketAction() {
      const input = document.getElementById('betAmountInput');
      if (rState === 'IDLE' || rState === 'CRASHED' || rState === 'CASHED') {
        clearTimeout(rRestartTimer);
        currentBet = parseInt(input.value || '100', 10);
        if (Number.isNaN(currentBet) || currentBet < 10) { showToast('حداقل مبلغ شرط ۱۰ تومان است'); return; }
        if (currentBet > balance) { showToast('موجودی کافی نیست'); return; }
        balance -= currentBet; updateBalanceDisplay();
        rState = 'FLYING'; rMultiplier = 1; rParticles = []; rStartTime = Date.now();
        rTargetCrash = Math.min(Math.max(1.05, 0.98 / (1.0 - Math.random())), 50.0);
        soundJump();
        const btn = document.getElementById('rocketActionBtn');
        btn.className = 'action-btn btn-cashout';
        btn.innerHTML = `<span>برداشت سود (${currentBet.toLocaleString('fa-IR')} تومان) 💰</span>`;
      } else if (rState === 'FLYING') {
        rState = 'CASHED';
        const won = Math.floor(currentBet * rMultiplier);
        balance += won; updateBalanceDisplay();
        soundWin();
        const btn = document.getElementById('rocketActionBtn');
        btn.className = 'action-btn btn-bet';
        btn.innerHTML = '<span>ثبت شرط بعدی 🔄</span>';
        showToast(`برداشت شد: ${won.toLocaleString('fa-IR')} تومان`);
        scheduleRocketRestart();
      }
    }

    // Chicken Road logic
    const chCanvas = document.getElementById('chickenCanvas');
    const chCtx = chCanvas.getContext('2d');
    const GRID_COLS = 9;
    const GRID_ROWS = 10;
    const CELL_W = 400 / GRID_COLS;
    const CELL_H = 400 / GRID_ROWS;

    let chRunning = false;
    let chAnimId = null;
    let chickenPos = { x: 4, y: 9 };
    let chickenStake = 100;
    let chickenCurrentMultiplier = 1;
    let chickenPotentialWin = 0;
    let chickenLanes = [];
    let chickenRoundStarted = false;

    function initChickenGame() {
      chickenStake = 100;
      chickenCurrentMultiplier = 1;
      chickenPotentialWin = 0;
      chickenPos = { x: 4, y: 9 };
      chickenLanes = Array.from({ length: 10 }, (_, i) => ({
        index: i,
        safe: Math.random() > 0.35,
        multiplier: Number((1 + Math.random() * 2.8).toFixed(2)),
        locked: false,
        type: i % 2 === 0 ? 'grass' : (Math.random() > 0.5 ? 'road' : 'river')
      }));
      chickenRoundStarted = true;
      chRunning = true;
      updateChickenUI();
      if (!chAnimId) chAnimId = requestAnimationFrame(chickenGameLoop);
    }

    function updateChickenUI() {
      document.getElementById('chickenMultiplierText').textContent = `${chickenCurrentMultiplier.toFixed(2)}x`;
      document.getElementById('chickenCashoutText').textContent = `${Math.floor(chickenStake * chickenCurrentMultiplier).toLocaleString('fa-IR')} تومان`;
    }

    function resetChickenRound() {
      chRunning = false;
      chickenRoundStarted = false;
      chickenCurrentMultiplier = 1;
      chickenPotentialWin = 0;
      chickenPos = { x: 4, y: 9 };
      updateChickenUI();
      initChickenGame();
    }

    function moveChicken(dir) {
      if (!chRunning || !chickenRoundStarted) return;
      if (dir === 'up') {
        const nextY = chickenPos.y - 1;
        if (nextY < 0) {
          const win = Math.floor(chickenStake * chickenCurrentMultiplier);
          balance += win; updateBalanceDisplay();
          soundWin();
          showToast(`بازی تمام شد و ${win.toLocaleString('fa-IR')} تومان برداشت شد.`);
          resetChickenRound();
          return;
        }

        const lane = chickenLanes[nextY];
        if (!lane) {
          resetChickenRound();
          return;
        }

        if (lane.safe) {
          chickenPos.y = nextY;
          chickenCurrentMultiplier = Number((chickenCurrentMultiplier * lane.multiplier).toFixed(2));
          lane.locked = true;
          chickenPotentialWin = Math.floor(chickenStake * chickenCurrentMultiplier);
          updateChickenUI();
          showToast(`لاین امن شد • ضریب ${chickenCurrentMultiplier.toFixed(2)}x`);
          soundJump();
        } else {
          balance -= chickenStake; updateBalanceDisplay();
          soundCrash();
          showToast(`تصادف! کل مبلغ ${chickenStake.toLocaleString('fa-IR')} تومان سوخت.`);
          resetChickenRound();
        }
      } else if (dir === 'down') {
        if (chickenPos.y < 9) chickenPos.y += 1;
      } else if (dir === 'left') {
        if (chickenPos.x > 0) chickenPos.x -= 1;
      } else if (dir === 'right') {
        if (chickenPos.x < GRID_COLS - 1) chickenPos.x += 1;
      }
    }

    function cashOutChicken() {
      if (!chRunning || !chickenRoundStarted) return;
      const win = Math.floor(chickenStake * chickenCurrentMultiplier);
      if (win > 0) {
        balance += win; updateBalanceDisplay();
        soundWin();
        showToast(`برداشت انجام شد: ${win.toLocaleString('fa-IR')} تومان`);
      }
      resetChickenRound();
    }

    function drawChicken(ctx, cx, cy) {
      ctx.save(); ctx.translate(cx, cy);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, 13, 13, 5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f1f5f9'; ctx.beginPath(); ctx.ellipse(-4, 2, 7, 5, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(-2, -14, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(3, -15, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -13, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.moveTo(10,-3); ctx.lineTo(18,0); ctx.lineTo(10,3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(5,-4,2,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    function drawBirdLane(ctx, x, y, width, color) {
      ctx.fillStyle = color; ctx.fillRect(x, y, width, CELL_H);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.strokeRect(x, y, width, CELL_H);
    }

    function drawCar(ctx, x, y, width, color) {
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 4, width, CELL_H - 8);
      ctx.fillStyle = color; ctx.fillRect(2, 6, width - 4, CELL_H - 12);
      ctx.fillStyle = '#0f172a'; ctx.fillRect(10, 10, width - 20, CELL_H - 20);
      ctx.fillStyle = '#fef3c7'; ctx.fillRect(width - 6, 8, 3, 5); ctx.fillRect(width - 6, CELL_H - 13, 3, 5);
      ctx.restore();
    }

    function drawLog(ctx, x, y, width) {
      ctx.fillStyle = '#78350f'; ctx.fillRect(x, y, width, CELL_H);
      ctx.strokeStyle = '#e5e7eb'; ctx.strokeRect(x, y, width, CELL_H);
    }

    function chickenGameLoop() {
      chCtx.clearRect(0, 0, 400, 400);
      for (let i = 0; i < 10; i++) {
        const y = i * CELL_H;
        const lane = chickenLanes[i];
        if (!lane) continue;
        if (lane.type === 'grass') drawBirdLane(chCtx, 0, y, 400, '#166534');
        else if (lane.type === 'road') { drawBirdLane(chCtx, 0, y, 400, '#1e293b'); }
        else drawBirdLane(chCtx, 0, y, 400, '#0ea5e9');

        if (lane.locked) {
          chCtx.fillStyle = 'rgba(0,0,0,0.38)';
          chCtx.fillRect(0, y, 400, CELL_H);
        }

        if (lane.type === 'road') {
          for (let j = 0; j < 2; j++) {
            let x = ((j * 5) + (i * 1.7)) % (GRID_COLS + 2);
            x *= CELL_W;
            if (lane.locked) continue;
            drawCar(chCtx, x, y, CELL_W * 1.4, j % 2 === 0 ? '#ef4444' : '#3b82f6');
          }
        } else if (lane.type === 'river') {
          if (!lane.locked) drawLog(chCtx, 0, y, CELL_W * 2.3);
        }
      }

      const px = chickenPos.x * CELL_W + CELL_W / 2;
      const py = chickenPos.y * CELL_H + CELL_H / 2;
      drawChicken(chCtx, px, py);
      chAnimId = requestAnimationFrame(chickenGameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (activeGame !== 'chicken') return;
      if (e.key === 'ArrowUp' || e.key === 'w') moveChicken('up');
      if (e.key === 'ArrowDown' || e.key === 's') moveChicken('down');
      if (e.key === 'ArrowLeft' || e.key === 'a') moveChicken('left');
      if (e.key === 'ArrowRight' || e.key === 'd') moveChicken('right');
    });

    chCanvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
    }, { passive: true });
    let touchStartX = 0, touchStartY = 0;
    chCanvas.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) moveChicken(dx > 0 ? 'right' : 'left');
        else moveChicken(dy > 0 ? 'down' : 'up');
      } else moveChicken('up');
    });

    initChickenGame();
  </script>
</body>
</html>
