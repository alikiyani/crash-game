<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>گیم سنتر آرکید | انفجار و مرغ جاده</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0e17;
      --card-bg: #111827;
      --card-border: #1f293d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #06b6d4;
      --primary-glow: rgba(6, 182, 212, 0.35);
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.35);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.4);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Top Bar */
    header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .balance-chip {
      background: rgba(31, 41, 61, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 20px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .reload-btn {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: var(--success);
      border-radius: 12px;
      padding: 2px 7px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }
    .reload-btn:active {
      transform: scale(0.92);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      background: rgba(31, 41, 61, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text);
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      padding: 4px;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--primary);
      box-shadow: 0 0 14px var(--primary-glow);
    }

    main {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .game-section {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .game-section.active {
      display: flex;
    }

    /* Canvas Frame */
    .canvas-card {
      background: #080c14;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Panel Card */
    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .countdown-bar-container {
      background: rgba(31, 41, 61, 0.5);
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      width: 100%;
      position: relative;
    }

    .countdown-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #10b981);
      width: 100%;
      transition: width 0.1s linear;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .status-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Input & Preset Buttons */
    .input-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .num-input {
      flex: 1;
      background: #0b0f19;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      outline: none;
    }
    .num-input:focus {
      border-color: var(--primary);
    }

    .chip-btn {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip-btn:active {
      transform: scale(0.94);
      background: var(--primary);
      color: #000;
    }

    .preset-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-chips .chip-btn {
      flex: 1;
      text-align: center;
      min-width: 44px;
    }

    /* Action Buttons */
    .action-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .btn-green {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 0 18px var(--success-glow);
    }
    .btn-green:hover:not(:disabled) {
      filter: brightness(1.1);
    }
    .btn-green:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      box-shadow: 0 0 18px var(--gold-glow);
    }
    .btn-gold:hover:not(:disabled) {
      filter: brightness(1.1);
    }
    .btn-gold:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-red {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .btn-blue {
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: white;
      box-shadow: 0 0 18px var(--primary-glow);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.5);
      box-shadow: none !important;
    }

    /* Chicken Road specific styling */
    .difficulty-group {
      display: flex;
      gap: 6px;
      background: #0b0f19;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .diff-btn {
      flex: 1;
      padding: 7px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .diff-btn.active {
      background: #1e293b;
      color: var(--primary);
      border: 1px solid rgba(6, 182, 212, 0.4);
      box-shadow: 0 0 8px var(--primary-glow);
    }

    .multiplier-strip {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 4px 2px;
      scrollbar-width: none;
    }
    .multiplier-strip::-webkit-scrollbar {
      display: none;
    }

    .mult-step-badge {
      padding: 4px 8px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.2s;
    }

    .mult-step-badge.passed {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--success);
      color: var(--success);
    }

    .mult-step-badge.current {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 10px var(--gold-glow);
      transform: scale(1.08);
    }

    .chicken-actions-row {
      display: flex;
      gap: 8px;
    }

    .chicken-actions-row .action-btn {
      flex: 1;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="user-badge">
      <div class="avatar">🎮</div>
      <span id="userNameDisplay">بازیکن آرکید</span>
    </div>

    <div class="header-actions">
      <div class="balance-chip">
        <span>سکه:</span>
        <span id="balanceDisplay">۱,۰۰۰</span>
        <button class="reload-btn" onclick="refillBalance()" title="شارژ رایگان">➕ شارژ</button>
      </div>
      <button class="btn-icon" id="soundToggle" onclick="toggleSound()" title="صدا">🔊</button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabRocketBtn" onclick="switchGame('rocket')">
      <span>🚀 بازی انفجار (اتوماتیک)</span>
    </button>
    <button class="tab-btn" id="tabChickenBtn" onclick="switchGame('chicken')">
      <span>🐔 مرغ جاده (Chicken Road)</span>
    </button>
  </div>

  <main>
    <!-- CRASH / ROCKET GAME -->
    <div id="rocketSection" class="game-section active">
      <div class="canvas-card">
        <canvas id="rocketCanvas" width="500" height="320"></canvas>
      </div>

      <div class="panel-card">
        <div class="status-text">
          <span id="rocketStatusLabel">در انتظار دور بعدی...</span>
          <span id="rocketTimerLabel" style="color:var(--primary);">۱۰.۰ ثانیه</span>
        </div>
        <div class="countdown-bar-container">
          <div id="rocketCountdownBar" class="countdown-bar-fill"></div>
        </div>

        <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">سکه شرط‌بندی:</div>
        <div class="input-row">
          <input type="number" id="rocketBetInput" class="num-input" value="100" min="10" step="10">
          <button class="chip-btn" onclick="adjustRocketBet('half')">½</button>
          <button class="chip-btn" onclick="adjustRocketBet('double')">۲×</button>
          <button class="chip-btn" onclick="adjustRocketBet('max')">حداکثر</button>
        </div>

        <div class="preset-chips">
          <button class="chip-btn" onclick="setRocketBet(50)">۵۰</button>
          <button class="chip-btn" onclick="setRocketBet(100)">۱۰۰</button>
          <button class="chip-btn" onclick="setRocketBet(250)">۲۵۰</button>
          <button class="chip-btn" onclick="setRocketBet(500)">۵۰۰</button>
        </div>

        <button id="rocketActionBtn" class="action-btn btn-blue" onclick="handleRocketAction()">
          <span>ثبت شرط برای پرتاب بعدی 🚀</span>
        </button>
      </div>
    </div>

    <!-- CHICKEN ROAD GAME -->
    <div id="chickenSection" class="game-section">
      <div class="canvas-card">
        <canvas id="chickenCanvas" width="540" height="300"></canvas>
      </div>

      <!-- Multiplier Highway Road Strip -->
      <div class="multiplier-strip" id="chickenMultStrip">
        <!-- populated dynamically -->
      </div>

      <div class="panel-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.8rem; font-weight:700; color:var(--text-muted);">درجه سختی جاده:</span>
          <span id="chickenDangerLabel" style="font-size:0.75rem; color:var(--accent); font-weight:700;">خطر برخورد: ۱۰٪</span>
        </div>

        <div class="difficulty-group">
          <button class="diff-btn active" id="diffEasy" onclick="setDifficulty('easy')">آسان (Easy)</button>
          <button class="diff-btn" id="diffMedium" onclick="setDifficulty('medium')">متوسط (Medium)</button>
          <button class="diff-btn" id="diffHard" onclick="setDifficulty('hard')">سخت (Hard)</button>
        </div>

        <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">سکه ورود به جاده:</div>
        <div class="input-row">
          <button class="chip-btn" onclick="adjustChickenStake('minus')">➖</button>
          <input type="number" id="chickenStakeInput" class="num-input" value="100" min="10" step="10">
          <button class="chip-btn" onclick="adjustChickenStake('plus')">➕</button>
          <button class="chip-btn" onclick="adjustChickenStake('double')">۲×</button>
        </div>

        <div class="preset-chips">
          <button class="chip-btn" onclick="setChickenStake(50)">۵۰</button>
          <button class="chip-btn" onclick="setChickenStake(100)">۱۰۰</button>
          <button class="chip-btn" onclick="setChickenStake(250)">۲۵۰</button>
          <button class="chip-btn" onclick="setChickenStake(500)">۵۰۰</button>
        </div>

        <div class="chicken-actions-row">
          <button id="chickenGoBtn" class="action-btn btn-green" onclick="handleChickenGo()">
            <span>حرکت (GO) 🐔</span>
          </button>
          <button id="chickenCashoutBtn" class="action-btn btn-gold" onclick="handleChickenCashout()" disabled>
            <span>برداشت (CASH OUT) 💰</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast">پیام</div>

  <script>
    /* ========================================================
       CORE TELEGRAM & AUDIO & BALANCE MANAGEMENT
    ======================================================== */
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user?.first_name) {
        document.getElementById('userNameDisplay').textContent = tg.initDataUnsafe.user.first_name;
      }
    }

    function haptic(type = 'light') {
      try {
        if (tg?.HapticFeedback) {
          if (type === 'light') tg.HapticFeedback.impactOccurred('light');
          else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
          else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
          else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
          else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        }
      } catch (e) {}
    }

    // Sound FX Synthesis
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
      showToast(soundEnabled ? 'صدا فعال شد' : 'صدا قطع شد');
    }

    function playTone(freq, type, duration, slideFreq = null) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideFreq) {
          osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundBeep() { playTone(520, 'sine', 0.08); }
    function soundLaunch() { playTone(240, 'triangle', 0.4, 600); }
    function soundHop() { playTone(320, 'sine', 0.12, 540); }
    function soundCrash() { playTone(140, 'sawtooth', 0.4, 30); }
    function soundWin() {
      playTone(440, 'sine', 0.1);
      setTimeout(() => playTone(587, 'sine', 0.1), 100);
      setTimeout(() => playTone(880, 'sine', 0.25), 200);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Arcade Balance
    let balance = parseInt(localStorage.getItem('arcade_balance') || '1000', 10);
    function updateBalanceDisplay() {
      document.getElementById('balanceDisplay').textContent = balance.toLocaleString('fa-IR');
      localStorage.setItem('arcade_balance', balance.toString());
    }
    updateBalanceDisplay();

    function refillBalance() {
      balance += 1000;
      updateBalanceDisplay();
      soundWin();
      haptic('success');
      showToast('🎁 ۱,۰۰۰ سکه رایگان به حسابتان اضافه شد!');
    }

    function switchGame(game) {
      document.getElementById('tabRocketBtn').classList.toggle('active', game === 'rocket');
      document.getElementById('tabChickenBtn').classList.toggle('active', game === 'chicken');
      document.getElementById('rocketSection').classList.toggle('active', game === 'rocket');
      document.getElementById('chickenSection').classList.toggle('active', game === 'chicken');
      haptic('light');
    }

    /* ========================================================
       ROCKET CRASH GAME - CONTINUOUS 10-SECOND AUTO LOOP
    ======================================================== */
    const rCanvas = document.getElementById('rocketCanvas');
    const rCtx = rCanvas.getContext('2d');

    const COUNTDOWN_TOTAL_MS = 10000; // 10 seconds
    let rGlobalState = 'COUNTDOWN'; // COUNTDOWN, FLYING, CRASHED
    let rCountdownEndTime = Date.now() + COUNTDOWN_TOTAL_MS;
    let rMultiplier = 1.00;
    let rTargetCrash = 2.00;
    let rFlightStartTime = 0;

    let userInCurrentFlight = false;
    let userHasBetNextRound = false;
    let userCurrentStake = 100;
    let userCashedOut = false;
    let userWonAmount = 0;

    let rParticles = [];
    const rStars = Array.from({ length: 45 }, () => ({
      x: Math.random() * 500,
      y: Math.random() * 320,
      size: Math.random() * 1.8 + 0.5,
      speed: Math.random() * 0.9 + 0.3
    }));

    function adjustRocketBet(action) {
      const input = document.getElementById('rocketBetInput');
      let val = parseInt(input.value || '100', 10);
      if (action === 'half') val = Math.max(10, Math.floor(val / 2));
      else if (action === 'double') val = Math.min(balance, val * 2);
      else if (action === 'max') val = Math.max(10, balance);
      input.value = val;
    }

    function setRocketBet(val) {
      document.getElementById('rocketBetInput').value = Math.min(balance, val);
    }

    function handleRocketAction() {
      initAudio();
      const input = document.getElementById('rocketBetInput');
      const stake = parseInt(input.value || '100', 10);

      if (rGlobalState === 'COUNTDOWN') {
        if (!userHasBetNextRound) {
          if (stake > balance) {
            showToast('سکه کافی نیست! از دکمه شارژ استفاده کنید');
            return;
          }
          if (stake < 10) {
            showToast('حداقل مقدار شرط ۱۰ سکه است');
            return;
          }
          userHasBetNextRound = true;
          userCurrentStake = stake;
          balance -= stake;
          updateBalanceDisplay();
          soundBeep();
          haptic('medium');
          updateRocketButtonUI();
          showToast(`شرط ${stake.toLocaleString('fa-IR')} سکه برای پرواز بعدی ثبت شد`);
        } else {
          // Cancel bet
          userHasBetNextRound = false;
          balance += userCurrentStake;
          updateBalanceDisplay();
          soundBeep();
          updateRocketButtonUI();
          showToast('شرط لغو شد و سکه‌ها برگشت');
        }
      } else if (rGlobalState === 'FLYING') {
        if (userInCurrentFlight && !userCashedOut) {
          // Cash out!
          userCashedOut = true;
          userWonAmount = Math.floor(userCurrentStake * rMultiplier);
          balance += userWonAmount;
          updateBalanceDisplay();
          soundWin();
          haptic('success');
          updateRocketButtonUI();
          showToast(`🎉 تبریک! ${userWonAmount.toLocaleString('fa-IR')} سکه برداشت شد!`);
        }
      }
    }

    function updateRocketButtonUI() {
      const btn = document.getElementById('rocketActionBtn');

      if (rGlobalState === 'COUNTDOWN') {
        btn.disabled = false;
        if (userHasBetNextRound) {
          btn.className = 'action-btn btn-red';
          btn.innerHTML = `<span>شرط ثبت شد (${userCurrentStake.toLocaleString('fa-IR')} سکه) - کلیک برای لغو ❌</span>`;
        } else {
          btn.className = 'action-btn btn-blue';
          btn.innerHTML = `<span>ثبت شرط برای پرتاب بعدی 🚀</span>`;
        }
      } else if (rGlobalState === 'FLYING') {
        if (userInCurrentFlight) {
          if (!userCashedOut) {
            const currentWin = Math.floor(userCurrentStake * rMultiplier);
            btn.disabled = false;
            btn.className = 'action-btn btn-green';
            btn.innerHTML = `<span>برداشت سود (${currentWin.toLocaleString('fa-IR')} سکه) 💰</span>`;
          } else {
            btn.disabled = true;
            btn.className = 'action-btn btn-gold';
            btn.innerHTML = `<span>برداشت شد در ${rMultiplier.toFixed(2)}x (${userWonAmount.toLocaleString('fa-IR')} سکه) ✓</span>`;
          }
        } else {
          btn.disabled = true;
          btn.className = 'action-btn btn-blue';
          btn.innerHTML = `<span>پرواز در جریان است... (دور بعد شرکت کنید)</span>`;
        }
      } else if (rGlobalState === 'CRASHED') {
        btn.disabled = true;
        btn.className = 'action-btn btn-red';
        btn.innerHTML = `<span>منفجر شد در ${rTargetCrash.toFixed(2)}x 💥</span>`;
      }
    }

    function startRocketFlight() {
      rGlobalState = 'FLYING';
      rMultiplier = 1.00;
      rFlightStartTime = Date.now();
      rParticles = [];

      // Determine crash multiplier (Provably fair style curve)
      const r = Math.random();
      if (r < 0.05) {
        rTargetCrash = 1.00 + Math.random() * 0.15; // Instant crash
      } else {
        rTargetCrash = Math.min(Math.max(1.08, 0.98 / (1.0 - r)), 40.0);
      }

      userInCurrentFlight = userHasBetNextRound;
      userCashedOut = false;
      userHasBetNextRound = false;

      soundLaunch();
      haptic('heavy');
      updateRocketButtonUI();
    }

    function crashRocketFlight() {
      rGlobalState = 'CRASHED';
      soundCrash();
      haptic('error');

      // Explosion particles
      for (let i = 0; i < 40; i++) {
        rParticles.push({
          x: 250,
          y: 160,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: 4 + Math.random() * 8,
          color: Math.random() > 0.4 ? '#f43f5e' : '#fbbf24',
          life: 1.0,
          decay: 0.02 + Math.random() * 0.02
        });
      }

      updateRocketButtonUI();

      // Wait 2.5 seconds, then begin next 10-second countdown!
      setTimeout(() => {
        rGlobalState = 'COUNTDOWN';
        rCountdownEndTime = Date.now() + COUNTDOWN_TOTAL_MS;
        userInCurrentFlight = false;
        userCashedOut = false;
        updateRocketButtonUI();
      }, 2500);
    }

    function rocketLoop() {
      rCtx.fillStyle = '#070a12';
      rCtx.fillRect(0, 0, 500, 320);

      // Stars
      rCtx.fillStyle = '#94a3b8';
      rStars.forEach(s => {
        if (rGlobalState === 'FLYING') {
          s.x -= s.speed * (1 + (rMultiplier - 1) * 0.8);
          s.y += s.speed * 0.5;
          if (s.x < 0) s.x = 500;
          if (s.y > 320) s.y = 0;
        }
        rCtx.beginPath();
        rCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        rCtx.fill();
      });

      // Neon Grid lines
      rCtx.strokeStyle = 'rgba(31, 41, 61, 0.4)';
      rCtx.lineWidth = 1;
      for (let x = 40; x < 500; x += 60) {
        rCtx.beginPath();
        rCtx.moveTo(x, 0);
        rCtx.lineTo(x, 320);
        rCtx.stroke();
      }
      for (let y = 40; y < 320; y += 50) {
        rCtx.beginPath();
        rCtx.moveTo(0, y);
        rCtx.lineTo(500, y);
        rCtx.stroke();
      }

      if (rGlobalState === 'COUNTDOWN') {
        const remaining = Math.max(0, rCountdownEndTime - Date.now());
        const secs = (remaining / 1000).toFixed(1);
        const pct = Math.min(100, Math.max(0, (remaining / COUNTDOWN_TOTAL_MS) * 100));

        document.getElementById('rocketStatusLabel').textContent = 'آماده‌سازی برای پرتاب بعدی...';
        document.getElementById('rocketTimerLabel').textContent = `${secs} ثانیه`;
        document.getElementById('rocketCountdownBar').style.width = `${pct}%`;

        // Big countdown text on canvas
        rCtx.save();
        rCtx.textAlign = 'center';
        rCtx.fillStyle = '#06b6d4';
        rCtx.font = 'bold 22px system-ui';
        rCtx.fillText('پرتاب موشک در:', 250, 130);
        rCtx.font = 'bold 54px monospace';
        rCtx.fillStyle = '#f8fafc';
        rCtx.shadowColor = 'rgba(6, 182, 212, 0.8)';
        rCtx.shadowBlur = 18;
        rCtx.fillText(`${secs}s`, 250, 195);
        rCtx.restore();

        if (remaining <= 0) {
          startRocketFlight();
        }
      } else if (rGlobalState === 'FLYING') {
        const elapsedSec = (Date.now() - rFlightStartTime) / 1000;
        rMultiplier = Math.pow(Math.E, 0.065 * elapsedSec);

        document.getElementById('rocketStatusLabel').textContent = 'موشک در حال اوج‌گیری 🚀';
        document.getElementById('rocketTimerLabel').textContent = `${rMultiplier.toFixed(2)}x`;
        document.getElementById('rocketCountdownBar').style.width = '100%';

        if (rMultiplier >= rTargetCrash) {
          crashRocketFlight();
        } else {
          updateRocketButtonUI();
        }

        // Draw curved flight path
        const progress = Math.min(1, (rMultiplier - 1.0) / 8.0);
        const rocketX = 60 + progress * 340;
        const rocketY = 270 - progress * 210;

        rCtx.save();
        rCtx.strokeStyle = 'rgba(6, 182, 212, 0.6)';
        rCtx.lineWidth = 3;
        rCtx.shadowColor = '#06b6d4';
        rCtx.shadowBlur = 12;
        rCtx.beginPath();
        rCtx.moveTo(50, 280);
        rCtx.quadraticCurveTo(180, 270, rocketX, rocketY);
        rCtx.stroke();
        rCtx.restore();

        // Particles
        for (let i = 0; i < 2; i++) {
          rParticles.push({
            x: rocketX - 15,
            y: rocketY + 8,
            vx: -2 - Math.random() * 2,
            vy: 1 + (Math.random() - 0.5) * 2,
            size: 3 + Math.random() * 4,
            color: Math.random() > 0.4 ? '#f59e0b' : '#ef4444',
            life: 1.0,
            decay: 0.05
          });
        }

        // Draw rocket vector
        drawVectorRocket(rocketX, rocketY, -0.45);

        // Big Multiplier
        rCtx.save();
        rCtx.textAlign = 'center';
        rCtx.font = 'bold 50px monospace';
        rCtx.fillStyle = '#10b981';
        rCtx.shadowColor = 'rgba(16, 185, 129, 0.8)';
        rCtx.shadowBlur = 16;
        rCtx.fillText(`${rMultiplier.toFixed(2)}x`, 250, 110);
        rCtx.restore();

      } else if (rGlobalState === 'CRASHED') {
        document.getElementById('rocketStatusLabel').textContent = 'منفجر شد 💥';
        document.getElementById('rocketTimerLabel').textContent = `${rTargetCrash.toFixed(2)}x`;

        rCtx.save();
        rCtx.textAlign = 'center';
        rCtx.font = 'bold 50px monospace';
        rCtx.fillStyle = '#f43f5e';
        rCtx.shadowColor = 'rgba(244, 63, 94, 0.9)';
        rCtx.shadowBlur = 20;
        rCtx.fillText(`💥 ${rTargetCrash.toFixed(2)}x`, 250, 110);

        rCtx.font = 'bold 20px system-ui';
        rCtx.fillStyle = '#f8fafc';
        rCtx.shadowBlur = 0;
        rCtx.fillText('آماده‌سازی دور بعدی...', 250, 160);
        rCtx.restore();
      }

      // Render & update particles
      rParticles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life > 0) {
          rCtx.save();
          rCtx.globalAlpha = Math.max(0, p.life);
          rCtx.fillStyle = p.color;
          rCtx.beginPath();
          rCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          rCtx.fill();
          rCtx.restore();
        }
      });
      rParticles = rParticles.filter(p => p.life > 0);

      requestAnimationFrame(rocketLoop);
    }

    function drawVectorRocket(x, y, angle) {
      rCtx.save();
      rCtx.translate(x, y);
      rCtx.rotate(angle);

      // Rocket body
      rCtx.fillStyle = '#e2e8f0';
      rCtx.beginPath();
      rCtx.ellipse(0, 0, 22, 10, 0, 0, Math.PI * 2);
      rCtx.fill();

      // Cockpit Window
      rCtx.fillStyle = '#06b6d4';
      rCtx.beginPath();
      rCtx.arc(8, -1, 4, 0, Math.PI * 2);
      rCtx.fill();

      // Red Tip
      rCtx.fillStyle = '#ef4444';
      rCtx.beginPath();
      rCtx.moveTo(18, -4);
      rCtx.lineTo(26, 0);
      rCtx.lineTo(18, 4);
      rCtx.closePath();
      rCtx.fill();

      // Tail Fins
      rCtx.fillStyle = '#f43f5e';
      rCtx.beginPath();
      rCtx.moveTo(-12, -8);
      rCtx.lineTo(-20, -14);
      rCtx.lineTo(-16, -2);
      rCtx.closePath();
      rCtx.fill();

      rCtx.beginPath();
      rCtx.moveTo(-12, 8);
      rCtx.lineTo(-20, 14);
      rCtx.lineTo(-16, 2);
      rCtx.closePath();
      rCtx.fill();

      // Flame
      rCtx.fillStyle = '#fbbf24';
      rCtx.beginPath();
      rCtx.moveTo(-20, -5);
      rCtx.lineTo(-32 - Math.random() * 8, 0);
      rCtx.lineTo(-20, 5);
      rCtx.closePath();
      rCtx.fill();

      rCtx.restore();
    }

    requestAnimationFrame(rocketLoop);

    /* ========================================================
       CHICKEN ROAD GAME - HIGHWAY CROSSING WITH MULTIPLIERS
    ======================================================== */
    const chCanvas = document.getElementById('chickenCanvas');
    const chCtx = chCanvas.getContext('2d');

    const TOTAL_LANES = 10;
    const MULTIPLIERS_EASY = [1.08, 1.22, 1.45, 1.80, 2.30, 3.10, 4.40, 6.50, 10.5, 18.0];
    const MULTIPLIERS_MEDIUM = [1.18, 1.48, 1.95, 2.70, 3.90, 5.80, 9.20, 15.0, 26.0, 50.0];
    const MULTIPLIERS_HARD = [1.35, 1.90, 2.80, 4.40, 7.20, 12.5, 23.0, 45.0, 90.0, 200.0];

    let currentDifficulty = 'easy';
    let activeMultipliers = MULTIPLIERS_EASY;
    let crashChances = { easy: 0.10, medium: 0.20, hard: 0.33 };

    let chState = 'IDLE'; // IDLE, PLAYING, CRASHED, WON
    let chCurrentStep = 0; // 0 = start curb, 1 to 10 = lanes
    let chStake = 100;
    let chAnimFrame = 0;

    // Traffic cars
    const trafficCars = [];
    function initTraffic() {
      trafficCars.length = 0;
      for (let lane = 1; lane <= TOTAL_LANES; lane++) {
        const laneX = 45 + (lane - 1) * 48;
        const carCount = Math.random() > 0.4 ? 2 : 1;
        const speed = (lane % 2 === 0 ? 1 : -1) * (1.2 + Math.random() * 1.5);
        const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#06b6d4'];

        for (let i = 0; i < carCount; i++) {
          trafficCars.push({
            lane: lane,
            x: laneX,
            y: Math.random() * 300,
            speed: speed,
            color: colors[Math.floor(Math.random() * colors.length)],
            type: Math.random() > 0.6 ? 'truck' : 'car'
          });
        }
      }
    }
    initTraffic();

    function setDifficulty(diff) {
      if (chState === 'PLAYING') {
        showToast('در حین بازی امکان تغییر سختی نیست');
        return;
      }
      currentDifficulty = diff;
      document.getElementById('diffEasy').classList.toggle('active', diff === 'easy');
      document.getElementById('diffMedium').classList.toggle('active', diff === 'medium');
      document.getElementById('diffHard').classList.toggle('active', diff === 'hard');

      if (diff === 'easy') {
        activeMultipliers = MULTIPLIERS_EASY;
        document.getElementById('chickenDangerLabel').textContent = 'خطر برخورد: ۱۰٪';
      } else if (diff === 'medium') {
        activeMultipliers = MULTIPLIERS_MEDIUM;
        document.getElementById('chickenDangerLabel').textContent = 'خطر برخورد: ۲۰٪';
      } else {
        activeMultipliers = MULTIPLIERS_HARD;
        document.getElementById('chickenDangerLabel').textContent = 'خطر برخورد: ۳۳٪';
      }
      renderMultiplierStrip();
      haptic('light');
    }

    function renderMultiplierStrip() {
      const container = document.getElementById('chickenMultStrip');
      container.innerHTML = '';

      activeMultipliers.forEach((mult, index) => {
        const laneNum = index + 1;
        const badge = document.createElement('div');
        badge.className = 'mult-step-badge';
        if (laneNum < chCurrentStep) badge.classList.add('passed');
        if (laneNum === chCurrentStep) badge.classList.add('current');
        badge.textContent = `لاین ${laneNum}: ${mult.toFixed(2)}x`;
        container.appendChild(badge);
      });
    }
    renderMultiplierStrip();

    function adjustChickenStake(action) {
      if (chState === 'PLAYING') return;
      const input = document.getElementById('chickenStakeInput');
      let val = parseInt(input.value || '100', 10);
      if (action === 'minus') val = Math.max(10, val - 50);
      else if (action === 'plus') val = Math.min(balance, val + 50);
      else if (action === 'double') val = Math.min(balance, val * 2);
      input.value = val;
    }

    function setChickenStake(val) {
      if (chState === 'PLAYING') return;
      document.getElementById('chickenStakeInput').value = Math.min(balance, val);
    }

    function handleChickenGo() {
      initAudio();
      const input = document.getElementById('chickenStakeInput');

      if (chState === 'IDLE' || chState === 'CRASHED' || chState === 'WON') {
        // Start new run
        chStake = parseInt(input.value || '100', 10);
        if (chStake > balance) {
          showToast('سکه کافی نیست! از شارژ رایگان استفاده کنید');
          return;
        }
        if (chStake < 10) {
          showToast('حداقل مقدار ۱۰ سکه است');
          return;
        }

        balance -= chStake;
        updateBalanceDisplay();
        chState = 'PLAYING';
        chCurrentStep = 0;
      }

      // Step forward to next lane!
      chCurrentStep++;
      soundHop();
      haptic('medium');

      // Check collision chance for this lane
      const danger = crashChances[currentDifficulty];
      const isCrashed = Math.random() < danger;

      if (isCrashed) {
        // Splat!
        chState = 'CRASHED';
        soundCrash();
        haptic('error');
        updateChickenControlsUI();
        renderMultiplierStrip();
        showToast(`💥 تصادف در لاین ${chCurrentStep}! متاسفانه سوختی!`);
        return;
      }

      // Safe step!
      renderMultiplierStrip();
      updateChickenControlsUI();

      if (chCurrentStep === TOTAL_LANES) {
        // Completed all lanes!
        const totalWon = Math.floor(chStake * activeMultipliers[TOTAL_LANES - 1]);
        balance += totalWon;
        updateBalanceDisplay();
        chState = 'WON';
        soundWin();
        haptic('success');
        updateChickenControlsUI();
        showToast(`🏆 فوق‌العاده! جاده تمام شد و ${totalWon.toLocaleString('fa-IR')} سکه برنده شدی!`);
      }
    }

    function handleChickenCashout() {
      if (chState !== 'PLAYING' || chCurrentStep === 0) return;

      const currentMult = activeMultipliers[chCurrentStep - 1];
      const winAmount = Math.floor(chStake * currentMult);
      balance += winAmount;
      updateBalanceDisplay();

      chState = 'WON';
      soundWin();
      haptic('success');
      updateChickenControlsUI();
      showToast(`💰 تبریک! ${winAmount.toLocaleString('fa-IR')} سکه در ضریب ${currentMult.toFixed(2)}x برداشت شد!`);
    }

    function updateChickenControlsUI() {
      const goBtn = document.getElementById('chickenGoBtn');
      const cashoutBtn = document.getElementById('chickenCashoutBtn');
      const stakeInput = document.getElementById('chickenStakeInput');

      if (chState === 'PLAYING') {
        stakeInput.disabled = true;
        const currentMult = activeMultipliers[chCurrentStep - 1];
        const currentWin = Math.floor(chStake * currentMult);

        goBtn.innerHTML = `<span>قدم بعدی (${chCurrentStep + 1}/10) 🐔</span>`;
        cashoutBtn.disabled = false;
        cashoutBtn.innerHTML = `<span>برداشت (${currentWin.toLocaleString('fa-IR')} سکه) 💰</span>`;
      } else {
        stakeInput.disabled = false;
        goBtn.innerHTML = `<span>شروع حرکت (GO) 🐔</span>`;
        cashoutBtn.disabled = true;
        cashoutBtn.innerHTML = `<span>برداشت (CASH OUT) 💰</span>`;
      }
    }

    // Chicken Render Loop
    function chickenRenderLoop() {
      chAnimFrame++;
      chCtx.fillStyle = '#0a0f1d';
      chCtx.fillRect(0, 0, 540, 300);

      // Start Sidewalk (Left curb)
      chCtx.fillStyle = '#1e293b';
      chCtx.fillRect(0, 0, 35, 300);
      chCtx.fillStyle = '#334155';
      chCtx.fillRect(32, 0, 3, 300);

      // Highway Lanes
      for (let l = 1; l <= TOTAL_LANES; l++) {
        const laneX = 35 + (l - 1) * 48;
        chCtx.fillStyle = (l % 2 === 0) ? '#0f172a' : '#141e33';
        chCtx.fillRect(laneX, 0, 48, 300);

        // Dashed lane separator line
        chCtx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        chCtx.lineWidth = 2;
        chCtx.setLineDash([8, 8]);
        chCtx.beginPath();
        chCtx.moveTo(laneX + 48, 0);
        chCtx.lineTo(laneX + 48, 300);
        chCtx.stroke();
        chCtx.setLineDash([]);

        // Multiplier Tag on Road top
        const mult = activeMultipliers[l - 1];
        chCtx.save();
        chCtx.fillStyle = (l < chCurrentStep) ? '#10b981' : (l === chCurrentStep ? '#f59e0b' : '#64748b');
        chCtx.font = 'bold 11px monospace';
        chCtx.textAlign = 'center';
        chCtx.fillText(`${mult.toFixed(2)}x`, laneX + 24, 20);
        chCtx.restore();
      }

      // Finish Sidewalk (Right curb)
      chCtx.fillStyle = '#1e293b';
      chCtx.fillRect(515, 0, 25, 300);
      chCtx.fillStyle = '#10b981';
      chCtx.fillRect(515, 0, 3, 300);

      // Render Traffic
      trafficCars.forEach(car => {
        car.y += car.speed;
        if (car.speed > 0 && car.y > 330) car.y = -40;
        if (car.speed < 0 && car.y < -40) car.y = 330;

        chCtx.save();
        chCtx.fillStyle = car.color;
        const carW = 22;
        const carH = car.type === 'truck' ? 44 : 32;

        // Rounded body
        chCtx.beginPath();
        chCtx.roundRect(car.x - carW / 2 + 12, car.y - carH / 2, carW, carH, 5);
        chCtx.fill();

        // Windshield
        chCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        chCtx.fillRect(car.x - carW / 2 + 15, car.y - carH / 4, carW - 6, carH / 3.5);

        // Headlights
        chCtx.fillStyle = '#fef08a';
        if (car.speed > 0) {
          chCtx.fillRect(car.x - carW / 2 + 14, car.y + carH / 2 - 4, 4, 3);
          chCtx.fillRect(car.x - carW / 2 + 24, car.y + carH / 2 - 4, 4, 3);
        } else {
          chCtx.fillRect(car.x - carW / 2 + 14, car.y - carH / 2 + 1, 4, 3);
          chCtx.fillRect(car.x - carW / 2 + 24, car.y - carH / 2 + 1, 4, 3);
        }

        chCtx.restore();
      });

      // Render Chicken
      let chickX = 18;
      let chickY = 150;
      if (chCurrentStep > 0) {
        chickX = 35 + (chCurrentStep - 1) * 48 + 24;
      }

      drawVectorChicken(chickX, chickY, chState === 'CRASHED');

      requestAnimationFrame(chickenRenderLoop);
    }

    function drawVectorChicken(cx, cy, isSplat) {
      chCtx.save();
      chCtx.translate(cx, cy);

      if (isSplat) {
        // Roasted / Splat Chicken
        chCtx.fillStyle = '#ef4444';
        chCtx.beginPath();
        chCtx.arc(0, 0, 16, 0, Math.PI * 2);
        chCtx.fill();

        chCtx.fillStyle = '#f59e0b';
        chCtx.font = 'bold 16px system-ui';
        chCtx.textAlign = 'center';
        chCtx.fillText('💥', 0, 6);
        chCtx.restore();
        return;
      }

      const bobbing = Math.sin(chAnimFrame * 0.15) * 2;

      // Legs
      chCtx.strokeStyle = '#f59e0b';
      chCtx.lineWidth = 3;
      chCtx.beginPath();
      chCtx.moveTo(-4, 8);
      chCtx.lineTo(-4, 15);
      chCtx.moveTo(4, 8);
      chCtx.lineTo(4, 15);
      chCtx.stroke();

      // Plump white body
      chCtx.fillStyle = '#ffffff';
      chCtx.beginPath();
      chCtx.ellipse(0, bobbing, 14, 12, 0, 0, Math.PI * 2);
      chCtx.fill();

      // Wing
      chCtx.fillStyle = '#e2e8f0';
      chCtx.beginPath();
      chCtx.ellipse(-4, bobbing + 2, 7, 5, -0.3, 0, Math.PI * 2);
      chCtx.fill();

      // Red Comb on head
      chCtx.fillStyle = '#ef4444';
      chCtx.beginPath();
      chCtx.arc(4, bobbing - 13, 3.5, 0, Math.PI * 2);
      chCtx.arc(8, bobbing - 15, 3.5, 0, Math.PI * 2);
      chCtx.arc(12, bobbing - 13, 3, 0, Math.PI * 2);
      chCtx.fill();

      // Chicken eye
      chCtx.fillStyle = '#0f172a';
      chCtx.beginPath();
      chCtx.arc(8, bobbing - 5, 2.5, 0, Math.PI * 2);
      chCtx.fill();

      // Yellow Beak
      chCtx.fillStyle = '#f59e0b';
      chCtx.beginPath();
      chCtx.moveTo(12, bobbing - 6);
      chCtx.lineTo(19, bobbing - 3);
      chCtx.lineTo(12, bobbing);
      chCtx.closePath();
      chCtx.fill();

      // Red Wattle
      chCtx.fillStyle = '#ef4444';
      chCtx.beginPath();
      chCtx.arc(10, bobbing + 2, 2.5, 0, Math.PI * 2);
      chCtx.fill();

      chCtx.restore();
    }

    requestAnimationFrame(chickenRenderLoop);
  </script>
